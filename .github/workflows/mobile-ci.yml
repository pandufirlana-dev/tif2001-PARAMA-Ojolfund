name: Android Mobile CI

# Tanpa filter 'paths' agar status check wajib (branch protection)
# selalu dilaporkan pada setiap PR ke main.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint & Unit Test Kotlin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint Check
        run: ./gradlew lintDebug --stacktrace

      - name: Run Local Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: mobile/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: mobile/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
